name: Feed health
run-name: Feed health (${{ inputs.delivery_test || 'scheduled' }}) [${{ inputs.trigger_id || 'native' }}]

on:
  schedule:
    - cron: "3-59/5 * * * *"
  workflow_dispatch:
    inputs:
      trigger_id:
        description: Optional automatic-trigger correlation ID
        type: string
        required: false
        default: ""
      delivery_test:
        description: Monitor-only delivery test
        type: choice
        required: true
        default: none
        options:
          - none
          - outage
          - degraded
          - recovery

permissions:
  contents: write
  issues: write

concurrency:
  group: feed-health
  cancel-in-progress: false

jobs:
  monitor:
    name: Check feeds and update incidents
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out monitor history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Run Upptime
        uses: upptime/uptime-monitor@74f0683383384927e064d76a5f21f340d6af36fc # v1.46.5
        with:
          command: update
        env:
          GH_PAT: ${{ github.token }}
          DUB_FEED_HEALTH_URL: ${{ inputs.delivery_test == 'outage' && 'https://www.thefileswithdub.com/__alert_delivery_test__' || inputs.delivery_test == 'degraded' && 'https://raw.githubusercontent.com/franklinburrus/thefileswithdub-status/main/fixtures/degraded-health.json' || 'https://www.thefileswithdub.com/api/feed-health' }}
